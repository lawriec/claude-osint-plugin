name: Tidy
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # Daily 6am UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v6

      - name: Lint and format
        run: |
          uv tool run ruff check --fix skills/osint/scripts/ tests/
          uv tool run ruff format skills/osint/scripts/ tests/

      - name: Validate JSON files
        run: |
          python3 -c "import json; json.load(open('.mcp.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Run skill integrity tests
        run: |
          uv run pytest tests/test_skill_integrity.py -v --tb=short 2>&1 | tee /tmp/test-output.txt || true

      - name: Check script blocks
        run: |
          echo "Checking all scripts have /// script blocks..."
          MISSING=""
          for f in skills/osint/scripts/*.py; do
            if ! grep -q '# /// script' "$f"; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "MISSING script blocks:$MISSING"
            exit 1
          fi
          echo "All scripts have /// script blocks"

      - name: Count TODOs and FIXMEs
        run: |
          echo "TODO/FIXME counts:"
          grep -rn "TODO\|FIXME" skills/ challenges/ tests/ --include="*.py" --include="*.md" | wc -l || echo "0"

      - name: Commit auto-fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: tidy auto-fixes"
          git push || true
