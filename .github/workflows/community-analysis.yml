name: OSINT Community Analysis
on:
  schedule:
    - cron: "0 9 * * 1"  # Weekly Monday 9am UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read skills/osint/scripts/loop-analyze-community.md and follow its instructions exactly."
          show_full_output: true
          settings: |
            {
              "permissions": {
                "allow": ["Bash", "Read", "Edit", "Write", "Glob", "Grep", "Agent"]
              }
            }
