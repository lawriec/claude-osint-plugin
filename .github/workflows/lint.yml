name: Lint

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'claude[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Python: ruff lint + format ---
      - uses: astral-sh/setup-uv@v6

      - name: Ruff auto-fix
        run: |
          uvx ruff check --fix skills/osint/scripts/ tests/ || true
          uvx ruff format skills/osint/scripts/ tests/

      # --- JSON: validate syntax ---
      - name: Validate JSON
        run: |
          for f in .mcp.json .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            if [ -f "$f" ]; then
              python3 -m json.tool "$f" > /dev/null || echo "::error file=$f::Invalid JSON"
            fi
          done

      # --- Commit auto-fixes if any (skip on default branch) ---
      - name: Commit auto-fixes
        id: commit-fixes
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git diff --name-only)" ]; then
            git add -A
            git commit -m "style: auto-fix lint issues (ruff)"
            git push
            echo "fixed=true" >> "$GITHUB_OUTPUT"
          else
            echo "fixed=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Check for remaining issues that tools couldn't fix ---
      - name: Check remaining issues
        run: |
          set -o pipefail
          issues=false

          echo "## Ruff check" >> "$GITHUB_STEP_SUMMARY"
          if ! uvx ruff check skills/osint/scripts/ tests/ 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
            issues=true
          fi

          echo "## Ruff format" >> "$GITHUB_STEP_SUMMARY"
          if ! uvx ruff format --check skills/osint/scripts/ tests/ 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
            issues=true
          fi

          # On the default branch, fail the workflow so lint issues are visible
          if [ "$issues" = "true" ] && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "::error::Lint issues found on default branch — see step summary above"
            exit 1
          fi
