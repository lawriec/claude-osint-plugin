name: Lint
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v6

      - name: Auto-fix Python
        run: |
          uv tool run ruff check --fix skills/osint/scripts/ tests/
          uv tool run ruff format skills/osint/scripts/ tests/

      - name: Validate JSON
        run: |
          python3 -c "import json; json.load(open('.mcp.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Commit auto-fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "style: auto-fix lint issues"
          git push || true

      - name: Check for remaining issues
        id: check
        run: |
          uv tool run ruff check skills/osint/scripts/ tests/ 2>&1 | tee /tmp/ruff-output.txt || true
          if [ -s /tmp/ruff-output.txt ]; then
            echo "has_issues=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fix remaining issues with Claude
        if: steps.check.outputs.has_issues == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Ruff found lint issues that auto-fix couldn't resolve. Read the output below and fix them manually:
            $(cat /tmp/ruff-output.txt)
            Fix the issues, then run `ruff check` again to verify.
